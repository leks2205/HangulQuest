plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}

	// Rebuild the questline index so a dropped-in JSON file is loaded without an extra step.
	doLast {
		def dir = new File(destinationDir, 'assets/hangulquest/data/questlines')
		if (dir.exists()) {
			def files = dir.listFiles()
					.findAll { it.isFile() && it.name.endsWith('.json') && !it.name.startsWith('_') && it.name != 'index.json' }
					.collect { it.name }
					.sort()
			new File(dir, 'index.json').text = groovy.json.JsonOutput.prettyPrint(
					groovy.json.JsonOutput.toJson(files)) + '\n'
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

jar {
	inputs.property 'projectName', project.name
	from('LICENSE') {
		rename { "${it}_${project.name}" }
	}
}
