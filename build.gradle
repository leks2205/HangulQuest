plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Dev-only run helpers: ./gradlew runClient -Pdemo=questlogdemo -PquickPlay="New World"
loom {
	runs {
		client {
			if (project.hasProperty('demo')) {
				property "hangulquest.${project.property('demo')}", "true"
			}
			if (project.hasProperty('quickPlay')) {
				programArgs "--quickPlaySingleplayer", project.property('quickPlay').toString()
			}
		}
	}
}

// Client game tests (src/gametest): ./gradlew runClientGameTest, see CONTRIBUTING.md.
// They are not part of `test` or `build`: they start a real client and need a display.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'hangulquest-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

jar {
	inputs.property 'projectName', project.name
	from('LICENSE') {
		rename { "${it}_${project.name}" }
	}
}
