name: Guide

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/main/resources/assets/hangulquest/data/questlines/**"
      - "tools/quest_tree.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Screenshots into the book
        run: cp -r docs/screenshots docs/book/src/screenshots

      - name: Regenerate the quest tree page
        run: python3 tools/quest_tree.py

      - name: Build the guide
        run: mdbook build docs/book

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
