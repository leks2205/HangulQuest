name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from the tag
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build the release jar
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.number }} --no-daemon

      - name: Collect assets and checksums
        run: |
          mkdir -p release
          cp build/libs/hangulquest-*.jar release/
          (cd release && sha256sum ./*.jar > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Hangul Quest ${TAG#v}" \
              --generate-notes \
              --notes "Fabric mod for Minecraft 26.3. Requires Fabric Loader 0.19.5+ and Fabric API 0.162.0+26.3 on Java 25. Client-side only. Check the download with \`sha256sum -c SHA256SUMS\`."
          fi
