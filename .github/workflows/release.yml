name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.0). Must equal v plus mod_version in gradle.properties.
        required: true

permissions:
  contents: write

# Actions are pinned by commit SHA (the tag is in the comment). To update one:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The jar is built from gradle.properties, so the tag has to say the same version. Otherwise a
      # tag could publish a jar whose version (and fabric.mod.json) disagrees with the release name.
      - name: Check the tag against mod_version
        id: version
        env:
          # An env var, not an inline expression: a tag name is user input.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::mod_version not found in gradle.properties"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' does not match mod_version '$version' in gradle.properties: expected 'v$version'. Bump mod_version (and CHANGELOG.md) before tagging."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$version" >> "$GITHUB_OUTPUT"

      # Saved progress is sacred: every release ships the progress.json it writes as a fixture, and
      # ProgressCompatibilityTest loads it forever after. There is no generator for these files yet
      # (they are real files written by the released build with synthetic data), so fail with a
      # clear message instead of releasing without one.
      - name: Check the progress fixture for this tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          fixture="src/test/resources/progress-fixtures/$TAG.json"
          if [ ! -f "$fixture" ]; then
            echo "::error::missing $fixture. Add the progress.json this version writes (synthetic data, see src/test/resources/progress-fixtures/README.md), list it in ProgressCompatibilityTest, and move the tag."
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$fixture"

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build the release jar
        run: ./gradlew build --no-daemon

      - name: Collect assets and checksums
        run: |
          mkdir -p release
          cp build/libs/hangulquest-*.jar release/
          (cd release && sha256sum ./*.jar > SHA256SUMS && cat SHA256SUMS)

      # The release text is the CHANGELOG section of this version (an rc falls back to the section of the
      # version it leads up to). The step fails when there is none, so a release never goes out with empty notes.
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          python3 tools/changelog_section.py "$VERSION" > release/NOTES.md
          printf '\nFabric mod for Minecraft 26.3. Requires Fabric Loader 0.19.5+ and Fabric API 0.162.0+26.3 on Java 25. Client-side only. Check the download with `sha256sum -c SHA256SUMS`.\n' >> release/NOTES.md
          cat release/NOTES.md

      # A version with a hyphen (3.0.0-rc.1, 3.1.0-beta.2) is a pre-release. Only the jar and its checksums are
      # uploaded; the notes file stays out of the assets. Nothing goes to Modrinth or CurseForge from here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.jar release/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file release/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" release/*.jar release/SHA256SUMS \
              --title "Hangul Quest ${VERSION}" \
              --notes-file release/NOTES.md \
              "${flags[@]}"
          fi
