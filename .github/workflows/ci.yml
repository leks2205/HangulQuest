name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled and edited: the mass-change guard reads the label and the PR body, so it must run again
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (the tag is in the comment). To update one:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # jsonschema lets QuestScaffoldTest check a scaffolded trail against the schema, too.
      - name: Install jsonschema
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Tests (engine plus all shipped questlines)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Korean lint (rules self-test, then every generated and authored line)
        run: |
          python3 tools/lint_korean.py --self-test
          ./gradlew test --no-daemon --tests '*SentenceDumpTest'
          python3 tools/lint_korean.py build/reports/korean/sentences.tsv --fail-on error

      - name: Korean review registry is up to date
        run: |
          python3 tools/review/export_lines.py --check
          python3 tools/review/status.py check

      - name: quest_tree.py agrees with the mod's TrailGraph
        run: |
          ./gradlew test --no-daemon --tests '*QuestDepthDumpTest'
          python3 tools/quest_tree.py --check-depths build/reports/quest-depths.json

      - name: Content ratchet (task variety and word recycling may only improve)
        run: |
          ./gradlew test --no-daemon --tests '*StepsDumpTest'
          python3 tools/variety.py --check
          python3 tools/coverage.py --check

      - name: Client game tests still compile
        run: ./gradlew gametestClasses --no-daemon

      - name: Keep the Korean lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: korean-lint
          path: build/reports/korean/
          if-no-files-found: ignore

      - name: Keep the content reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-reports
          path: build/reports/content/
          if-no-files-found: ignore

      - name: Build the mod jar
        run: ./gradlew build --no-daemon

      - name: Inspect the jar
        run: |
          jar="$(ls build/libs/hangulquest-*.jar | head -n 1)"
          echo "built: $jar"
          unzip -l "$jar" | tail -n 5
          # The files on disk are the source of truth: the jar must contain exactly those
          # questline files (the game lists the folder, there is no index), with unique ids.
          python3 tools/check_questline_index.py --jar "$jar"

  guard:
    name: Mass-change guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # At most 15 trail files or 300 Korean strings per PR, unless the label `mass-change-approved`
      # is set or an ADR in docs/decisions/ is referenced. GITHUB_BASE_REF is set by Actions.
      - name: Korean text is not changed in bulk
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 tools/content_guard.py --self-test
          python3 tools/content_guard.py

  content:
    name: Questline content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate every questline against the schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema
          python3 tools/validate_schema.py

      - name: Check the generated quest tree report
        run: python3 tools/quest_tree.py --check

  docs:
    name: Guide builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook
        run: |
          archive=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$archive"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $archive" | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Prepare screenshots and generated pages
        run: |
          cp -r docs/screenshots docs/book/src/screenshots
          python3 tools/quest_tree.py --check
          mdbook build docs/book

      - name: Check that every chapter is linked
        run: |
          missing=0
          for file in docs/book/src/*.md; do
            name="$(basename "$file")"
            [ "$name" = "SUMMARY.md" ] && continue
            grep -q "$name" docs/book/src/SUMMARY.md || { echo "not in SUMMARY.md: $name"; missing=1; }
          done
          exit "$missing"
